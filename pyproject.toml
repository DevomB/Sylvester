[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sylvester"
version = "1.1.0"
description = "An exact linear algebra workbench for the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Devom Brahmbhatt" }]
keywords = ["linear-algebra", "matrix", "rref", "determinant", "eigenvalues", "exact-arithmetic", "tui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DevomB/Sylvester"
Source = "https://github.com/DevomB/Sylvester"

[project.scripts]
sylvester = "sylvester.cli:main"

[tool.setuptools]
packages = ["sylvester", "sylvester.tui"]
