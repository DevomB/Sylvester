name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v
      - name: Check the command line runs
        run: |
          python -m sylvester outcomes
          python -m sylvester eigen -m "1 1; 1 0"
          python -m sylvester prove det-product "2 1; 3 4" "1 -2; 5 0"
